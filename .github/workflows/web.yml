name: Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/miniapp/**"
      - "packages/ui-contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/miniapp/**"
      - "packages/ui-contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test --workspace @highlife/web -- --run && npm test --workspace @highlife/miniapp -- --run
      - name: Typecheck
        run: npm run typecheck --workspace @highlife/web && npm run typecheck --workspace @highlife/miniapp
      - name: Build
        run: npm run build --workspace @highlife/web && npm run build --workspace @highlife/miniapp
        env:
          VITE_DEFAULT_HOMESERVER: https://testhighlife.strangled.net
          VITE_MINIAPP_ALLOWED_ORIGINS: https://testhighlife.strangled.net
          VITE_ELEMENT_CALL_URL: https://call.testhighlife.strangled.net
          VITE_LIVEKIT_JWT_URL: https://rtc.testhighlife.strangled.net/livekit/jwt
