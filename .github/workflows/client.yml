name: Client

on:
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "apps/client/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Flutter (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pin to 3.41 (Dart 3.11 for matrix ^9) and below 3.44 AGP9/KGP breakage.
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Enable platforms + fetch deps
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          # Platforms are vendored in git; flutter create is a no-op refresh when present.
          case "${{ matrix.target }}" in
            android) flutter create . --project-name highlife_client --org app.highlife --platforms=android ;;
            web)     flutter create . --project-name highlife_client --org app.highlife --platforms=web ;;
            linux)   flutter create . --project-name highlife_client --org app.highlife --platforms=linux ;;
            windows) flutter create . --project-name highlife_client --org app.highlife --platforms=windows ;;
          esac
          # pub.dev occasionally returns transient authorization failures (exit 69).
          attempt=0
          until flutter pub get; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "flutter pub get failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "flutter pub get failed (attempt ${attempt}); retrying…" >&2
            sleep $((attempt * 8))
          done
          flutter test
          flutter analyze --no-fatal-infos

      - name: Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev webkit2gtk-4.1

      - name: Harden Android launch (network perms + disable Impeller)
        if: matrix.target == 'android'
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          manifest=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          perms = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.POST_NOTIFICATIONS',
          ]
          for perm in perms:
              tag = f'<uses-permission android:name="{perm}" />'
              if perm not in text:
                  # Insert before <application>
                  needle = "<application"
                  idx = text.find(needle)
                  if idx < 0:
                      raise SystemExit("application tag not found")
                  text = text[:idx] + f"    {tag}\n" + text[idx:]
          if "io.flutter.embedding.android.EnableImpeller" not in text:
              needle = "</application>"
              meta = (
                  '        <meta-data\n'
                  '            android:name="io.flutter.embedding.android.EnableImpeller"\n'
                  '            android:value="false" />\n'
                  '    </application>'
              )
              if needle not in text:
                  raise SystemExit("application closing tag not found")
              text = text.replace(needle, meta, 1)
          text = text.replace('android:label="highlife_client"', 'android:label="HighLife"')
          path.write_text(text)
          PY
          grep -nE 'INTERNET|ACCESS_NETWORK_STATE|CAMERA|RECORD_AUDIO|MODIFY_AUDIO_SETTINGS|EnableImpeller' "$manifest"

      - name: Harden Android Gradle (Maven 429)
        if: matrix.target == 'android'
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android
          cat >> android/gradle.properties <<'EOF'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=10
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF
          # Prefer Google's Maven Central mirror ahead of repo.maven.apache.org.
          python3 - <<'PY'
          from pathlib import Path

          groovy = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }\n'
          kotlin = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n'
          for name in (
              "android/settings.gradle",
              "android/settings.gradle.kts",
              "android/build.gradle",
              "android/build.gradle.kts",
          ):
              path = Path(name)
              if not path.is_file():
                  continue
              text = path.read_text()
              if "maven-central.storage-download.googleapis.com" in text:
                  continue
              mirror = kotlin if name.endswith(".kts") else groovy
              for needle in ("repositories {", "repositories{"):
                  if needle in text:
                      path.write_text(text.replace(needle, needle + "\n        " + mirror, 1))
                      print(f"patched {name}")
                      break
          # flutter_local_notifications requires JDK desugaring.
          app_gradle = Path("android/app/build.gradle.kts")
          if app_gradle.is_file():
              text = app_gradle.read_text()
              if "isCoreLibraryDesugaringEnabled" not in text:
                  text = text.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
              if "desugar_jdk_libs" not in text:
                  block = (
                      "\ndependencies {\n"
                      '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                      "}\n"
                  )
                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                          1,
                      )
                  else:
                      text += block
              app_gradle.write_text(text)
              print("enabled core library desugaring")
          PY

      - name: Cache Gradle
        if: matrix.target == 'android'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/client/**/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Android release signing
        if: matrix.target == 'android'
        working-directory: apps/client
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set — building unsigned/debug-signed release APK"
            exit 0
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
          # Patch app build.gradle(.kts) to load key.properties when present.
          python3 - <<'PY'
          from pathlib import Path
          for name in ("android/app/build.gradle", "android/app/build.gradle.kts"):
              path = Path(name)
              if not path.is_file():
                  continue
              text = path.read_text()
              if "key.properties" in text:
                  print(f"{name} already signing-aware")
                  continue
              if name.endswith(".kts"):
                  snippet = '''
          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = java.util.Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }
          '''
                  # Insert before android {
                  if "android {" in text and "keystoreProperties" not in text:
                      text = text.replace("android {", snippet + "\nandroid {", 1)
                  signing = '''
              signingConfigs {
                  create("release") {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                          storeFile = file(keystoreProperties["storeFile"] as String)
                          storePassword = keystoreProperties["storePassword"] as String
                      }
                  }
              }
          '''
                  if "buildTypes {" in text and 'create("release")' not in text.split("signingConfigs")[0]:
                      text = text.replace("buildTypes {", signing + "\n    buildTypes {", 1)
                  text = text.replace(
                      'getByName("release") {',
                      'getByName("release") {\n            if (keystorePropertiesFile.exists()) signingConfig = signingConfigs.getByName("release")',
                      1,
                  )
              else:
                  snippet = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
                  if "android {" in text and "keystoreProperties" not in text:
                      text = text.replace("android {", snippet + "\nandroid {", 1)
                  signing = '''
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
              }
          '''
                  if "buildTypes {" in text:
                      text = text.replace("buildTypes {", signing + "\n    buildTypes {", 1)
                  text = text.replace(
                      "release {",
                      "release {\n            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release",
                      1,
                  )
              path.write_text(text)
              print(f"patched {name} for release signing")
          PY

      - name: Build Android APK
        if: matrix.target == 'android'
        working-directory: apps/client
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false"
        run: |
          set -euo pipefail
          # Maven Central / plugins.gradle.org occasionally return 429 on GH runners.
          for attempt in 1 2 3 4 5; do
            if flutter build apk --release --no-tree-shake-icons \
              --dart-define=HIGHLIFE_DEFAULT_HOMESERVER=https://testhighlife.strangled.net \
              --dart-define=HIGHLIFE_LIVEKIT_JWT_URL=https://rtc.testhighlife.strangled.net/livekit/jwt \
              --dart-define=HIGHLIFE_ELEMENT_CALL_URL=https://call.testhighlife.strangled.net \
              --dart-define=HIGHLIFE_LATEST_JSON_URL=https://testhighlife.strangled.net/client/latest.json \
              --dart-define=HIGHLIFE_RTC_AVAILABLE=true; then
              exit 0
            fi
            echo "Android APK build failed (attempt ${attempt}/5); sleeping before retry"
            sleep $((attempt * 45))
          done
          exit 1

      - name: Build Android App Bundle (signed when keystore present)
        if: matrix.target == 'android'
        working-directory: apps/client
        continue-on-error: true
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false"
        run: |
          set -euo pipefail
          if [ ! -f android/key.properties ]; then
            echo "No key.properties — skip AAB"
            exit 0
          fi
          flutter build appbundle --release --no-tree-shake-icons \
            --dart-define=HIGHLIFE_DEFAULT_HOMESERVER=https://testhighlife.strangled.net \
            --dart-define=HIGHLIFE_LIVEKIT_JWT_URL=https://rtc.testhighlife.strangled.net/livekit/jwt \
            --dart-define=HIGHLIFE_ELEMENT_CALL_URL=https://call.testhighlife.strangled.net \
            --dart-define=HIGHLIFE_LATEST_JSON_URL=https://testhighlife.strangled.net/client/latest.json \
            --dart-define=HIGHLIFE_RTC_AVAILABLE=true

      - name: Build Web WASM (vodozemac) when toolchain allows
        if: matrix.target == 'web'
        working-directory: apps/client
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if command -v cargo >/dev/null 2>&1; then
            echo "cargo already present"
          else
            curl https://sh.rustup.rs -sSf | sh -s -- -y
            # shellcheck disable=SC1091
            source "$HOME/.cargo/env"
          fi
          bash scripts/build_vodozemac_wasm.sh

      - name: Build Web
        if: matrix.target == 'web'
        working-directory: apps/client
        shell: bash
        run: |
          flutter build web --release --no-web-resources-cdn --base-href / \
            --dart-define=HIGHLIFE_DEFAULT_HOMESERVER=https://testhighlife.strangled.net \
            --dart-define=HIGHLIFE_LIVEKIT_JWT_URL=https://rtc.testhighlife.strangled.net/livekit/jwt \
            --dart-define=HIGHLIFE_ELEMENT_CALL_URL=https://call.testhighlife.strangled.net \
            --dart-define=HIGHLIFE_LATEST_JSON_URL=https://testhighlife.strangled.net/client/latest.json \
            --dart-define=HIGHLIFE_RTC_AVAILABLE=true

      - name: Build Linux
        if: matrix.target == 'linux'
        working-directory: apps/client
        shell: bash
        run: |
          flutter build linux --release \
            --dart-define=HIGHLIFE_DEFAULT_HOMESERVER=https://testhighlife.strangled.net \
            --dart-define=HIGHLIFE_LIVEKIT_JWT_URL=https://rtc.testhighlife.strangled.net/livekit/jwt \
            --dart-define=HIGHLIFE_ELEMENT_CALL_URL=https://call.testhighlife.strangled.net \
            --dart-define=HIGHLIFE_LATEST_JSON_URL=https://testhighlife.strangled.net/client/latest.json \
            --dart-define=HIGHLIFE_RTC_AVAILABLE=true

      - name: Silence MSVC experimental coroutines
        if: matrix.target == 'windows'
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          cmake=windows/CMakeLists.txt
          if grep -q '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS' "$cmake"; then
            echo "coroutine silence already present"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("windows/CMakeLists.txt")
          text = path.read_text()
          needle = "add_definitions(-DUNICODE -D_UNICODE)"
          insert = (
              needle
              + "\nadd_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
          )
          if needle in text:
              path.write_text(text.replace(needle, insert, 1))
          else:
              path.write_text(
                  "add_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)\n"
                  + text
              )
          print("patched CMakeLists for experimental coroutines")
          PY

      - name: Build Windows
        if: matrix.target == 'windows'
        working-directory: apps/client
        shell: bash
        run: |
          flutter build windows --release \
            --dart-define=HIGHLIFE_DEFAULT_HOMESERVER=https://testhighlife.strangled.net \
            --dart-define=HIGHLIFE_LIVEKIT_JWT_URL=https://rtc.testhighlife.strangled.net/livekit/jwt \
            --dart-define=HIGHLIFE_ELEMENT_CALL_URL=https://call.testhighlife.strangled.net \
            --dart-define=HIGHLIFE_LATEST_JSON_URL=https://testhighlife.strangled.net/client/latest.json \
            --dart-define=HIGHLIFE_RTC_AVAILABLE=true

      - name: Upload Android APK
        if: matrix.target == 'android'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: highlife-android
          path: apps/client/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android App Bundle
        if: matrix.target == 'android'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: highlife-android-aab
          path: apps/client/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Upload Web
        if: matrix.target == 'web'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: highlife-web
          path: apps/client/build/web

      - name: Commit pubspec.lock when generated
        if: matrix.target == 'android' && github.event_name != 'pull_request'
        working-directory: apps/client
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f pubspec.lock ]; then
            echo "no pubspec.lock"
            exit 0
          fi
          # Artifact only — operators can commit from CI artifact; avoid auto-push here.
          cp pubspec.lock "$RUNNER_TEMP/highlife-pubspec.lock"
          echo "pubspec.lock ready at runner temp"

      - name: Upload pubspec.lock
        if: matrix.target == 'android'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: highlife-pubspec-lock
          path: apps/client/pubspec.lock
          if-no-files-found: ignore

      - name: Upload Linux
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: highlife-linux
          path: apps/client/build/linux/x64/release/bundle

      - name: Upload Windows
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: highlife-windows
          path: apps/client/build/windows/x64/runner/Release

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      # Tag includes +build so a forgotten name bump cannot overwrite an
      # existing GitHub Release (softprops updates in place for the same tag).
      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          set -euo pipefail
          line="$(grep -E '^version:' apps/client/pubspec.yaml | head -n1 | awk '{print $2}')"
          name="${line%%+*}"
          build="${line##*+}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=client-v${name}-${build}" >> "$GITHUB_OUTPUT"

      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.name }}
          BUILD: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/highlife-android/*.apk dist/highlife-android.apk
          if compgen -G "artifacts/highlife-android-aab/*.aab" > /dev/null; then
            cp artifacts/highlife-android-aab/*.aab dist/highlife-android.aab
          fi
          (cd artifacts/highlife-windows && zip -qr ../../dist/highlife-windows-x64.zip .)
          (cd artifacts/highlife-linux && zip -qr ../../dist/highlife-linux-x64.zip .)
          (cd artifacts/highlife-web && zip -qr ../../dist/highlife-web.zip .)
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          python3 - <<PY
          import hashlib
          import json
          from pathlib import Path

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          files = {
              "android": Path("dist/highlife-android.apk"),
              "windows": Path("dist/highlife-windows-x64.zip"),
              "linux": Path("dist/highlife-linux-x64.zip"),
              "web": Path("dist/highlife-web.zip"),
          }
          aab = Path("dist/highlife-android.aab")
          data = {
            "version": "${VERSION}",
            "build": int("${BUILD}"),
            "notes": "HighLife client ${VERSION} (build ${BUILD})",
            "assets": {
              "android": "${BASE}/highlife-android.apk",
              "windows": "${BASE}/highlife-windows-x64.zip",
              "linux": "${BASE}/highlife-linux-x64.zip",
              "web": "${BASE}/highlife-web.zip",
            },
            "sha256": {key: sha256_file(path) for key, path in files.items()},
          }
          if aab.is_file():
              data["assets"]["android_aab"] = "${BASE}/highlife-android.aab"
              data["sha256"]["android_aab"] = sha256_file(aab)
          Path("dist/latest.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
          ls -lh dist
          cat dist/latest.json

      - name: Create / update Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: HighLife Client ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            HighLife client **${{ steps.version.outputs.name }}** (build ${{ steps.version.outputs.build }}).

            | Asset | Platform |
            |-------|----------|
            | `highlife-android.apk` | Android |
            | `highlife-android.aab` | Android App Bundle (when signed) |
            | `highlife-windows-x64.zip` | Windows |
            | `highlife-linux-x64.zip` | Linux |
            | `highlife-web.zip` | Web (static) |
            | `latest.json` | Updater metadata |

            Homeserver (prod): `https://testhighlife.strangled.net`

            Commit: `${{ github.sha }}`
          fail_on_unmatched_files: false
          files: |
            dist/highlife-android.apk
            dist/highlife-android.aab
            dist/highlife-windows-x64.zip
            dist/highlife-linux-x64.zip
            dist/highlife-web.zip
            dist/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
