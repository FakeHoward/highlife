name: Infrastructure

on:
  pull_request:
    paths:
      - "server/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate YAML and Compose
        env:
          POSTGRES_PASSWORD: validation-only
          SYNAPSE_REGISTRATION_SECRET: validation-only
          MAS_POSTGRES_PASSWORD: validation-only
          MAS_MATRIX_SECRET: validation-only-mas-matrix-secret-32b
          BOT_MATRIX_PASSWORD: validation-only
          LIVEKIT_KEY: validation-key
          LIVEKIT_SECRET: validation-only
          TURN_SHARED_SECRET: validation-only
          DEPLOY_PUBLIC_IP: 203.0.113.10
          GITHUB_REPOSITORY_OWNER: validation
          BOT_IMAGE_TAG: validation
          REDIS_PASSWORD: validation-only
          BOT_CRYPTO_STORE_PASSPHRASE: validation-only
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python scripts/validate-infrastructure.py
          python -m py_compile scripts/validate-infrastructure.py \
            server/render-synapse-config.py server/render-mas-config.py
          shellcheck server/bootstrap-bot.sh server/generate-synapse-config.sh \
            server/generate-mas-config.sh server/init-mas-db.sh server/migrate-syn2mas.sh \
            scripts/backup-highlife.sh
          docker run --rm --entrypoint caddy \
            -v "$PWD/server/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0-alpine validate --config /etc/caddy/Caddyfile

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start local infrastructure
        working-directory: server
        run: docker compose up -d
      - name: Check Synapse, MAS, registration and MatrixRTC
        working-directory: server
        run: |
          set -o pipefail
          # mas-cli config check only parses YAML. Wait until MAS HTTP is up —
          # otherwise curl to :8083 races the listener and exits 56.
          ready=0
          for _ in $(seq 1 120); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8008/health >/dev/null \
               && curl --fail --silent --max-time 5 \
                    http://127.0.0.1:8083/.well-known/openid-configuration >/dev/null \
               && curl --fail --silent --max-time 5 http://127.0.0.1:8081/ >/dev/null \
               && curl --fail --silent --max-time 5 http://127.0.0.1:8082/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1

          curl --fail --silent --show-error --max-time 15 \
            http://127.0.0.1:8008/_matrix/client/versions >/dev/null
          curl --fail --silent --show-error --max-time 15 \
            http://127.0.0.1:8008/_matrix/federation/v1/version >/dev/null

          # Compat login discovery is served by MAS on :8083 (local has no Caddy).
          curl --fail --silent --show-error --max-time 15 \
            http://127.0.0.1:8083/_matrix/client/v3/login |
            grep -F 'm.login.password' >/dev/null

          docker compose exec -T mas \
            /usr/local/bin/mas-cli --config /data/config.yaml manage register-user \
            --yes \
            --password ci-only-password \
            --no-admin \
            --ignore-password-complexity \
            ci-demo

          curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data '{"type":"m.login.password","identifier":{"type":"m.id.user","user":"ci-demo"},"password":"ci-only-password"}' \
            http://127.0.0.1:8083/_matrix/client/v3/login |
            grep -F '"access_token"' >/dev/null

          docker compose ps
      - name: Dump logs
        if: failure()
        working-directory: server
        run: |
          docker compose ps -a
          docker compose logs --tail=200 synapse-config mas-config mas-config-generate || true
          docker compose logs --tail=150
      - name: Stop local infrastructure
        if: always()
        working-directory: server
        run: docker compose down -v
