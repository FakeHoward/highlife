name: Provision account

on:
  workflow_dispatch:
    inputs:
      localpart:
        description: Matrix localpart to create (no @)
        required: true
        default: viewer
      password:
        description: Password for that account
        required: true

concurrency:
  group: highlife-provision-account
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Create Matrix account on production
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          LOCALPART: ${{ inputs.localpart }}
          PASSWORD: ${{ inputs.password }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          envs: LOCALPART,PASSWORD
          script: |
            set -eu
            cd /opt/highlife
            localpart="${LOCALPART}"
            password="${PASSWORD}"
            case "$localpart" in
              *[!a-zA-Z0-9._=-]*|"")
                echo "Invalid localpart" >&2
                exit 1
                ;;
            esac
            # docker compose exec does not use the image ENTRYPOINT.
            if output="$(docker compose -f docker-compose.prod.yml exec -T mas \
              /usr/local/bin/mas-cli --config /data/config.yaml manage register-user \
              --yes \
              --password "$password" \
              --no-admin \
              --ignore-password-complexity \
              "$localpart" 2>&1)"; then
              echo "Created @${localpart}:testhighlife.strangled.net"
              exit 0
            fi
            if printf '%s' "$output" | grep -qiE 'already exists|already taken|M_USER_IN_USE|Username already taken|user already exists'; then
              echo "Account already exists; password was not changed"
              exit 0
            fi
            printf '%s\n' "$output" >&2
            exit 1
