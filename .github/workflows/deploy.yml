name: Deploy HighLife

on:
  workflow_dispatch:

concurrency:
  group: highlife-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PUBLIC_IP: ${{ secrets.DEPLOY_PUBLIC_IP }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SYNAPSE_REGISTRATION_SECRET: ${{ secrets.SYNAPSE_REGISTRATION_SECRET }}
          MAS_POSTGRES_PASSWORD: ${{ secrets.MAS_POSTGRES_PASSWORD }}
          MAS_MATRIX_SECRET: ${{ secrets.MAS_MATRIX_SECRET }}
          BOT_MATRIX_PASSWORD: ${{ secrets.BOT_MATRIX_PASSWORD }}
          BOT_CRYPTO_STORE_PASSPHRASE: ${{ secrets.BOT_CRYPTO_STORE_PASSPHRASE }}
          DEMO_MATRIX_PASSWORD: ${{ secrets.DEMO_MATRIX_PASSWORD }}
          LIVEKIT_KEY: ${{ secrets.LIVEKIT_KEY }}
          LIVEKIT_SECRET: ${{ secrets.LIVEKIT_SECRET }}
          TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PUBLIC_IP \
            POSTGRES_PASSWORD SYNAPSE_REGISTRATION_SECRET \
            MAS_POSTGRES_PASSWORD MAS_MATRIX_SECRET BOT_MATRIX_PASSWORD \
            BOT_CRYPTO_STORE_PASSPHRASE DEMO_MATRIX_PASSWORD LIVEKIT_KEY \
            LIVEKIT_SECRET TURN_SHARED_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing environment secret: ${name}"
              missing=1
            fi
          done
          if [ -z "${DEPLOY_SSH_KEY}" ] && [ -z "${DEPLOY_PASSWORD}" ]; then
            echo "::error::Missing deploy auth: set DEPLOY_SSH_KEY or DEPLOY_PASSWORD (or both)"
            missing=1
          fi
          # CI may use a deploy key; this never changes sshd on the VPS.
          # Password SSH for humans stays whatever you configured on the server.
          if [ -n "${DEPLOY_SSH_KEY}" ] && [ -n "${DEPLOY_PASSWORD}" ]; then
            echo "Deploy auth: SSH key for Actions (password secret also present; server login unchanged)"
          elif [ -n "${DEPLOY_SSH_KEY}" ]; then
            echo "Deploy auth: SSH key for Actions only"
          else
            echo "Deploy auth: password for Actions (your interactive SSH password login is unchanged)"
          fi
          test "$missing" = 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate infrastructure
        env:
          POSTGRES_PASSWORD: validation-only
          SYNAPSE_REGISTRATION_SECRET: validation-only
          MAS_POSTGRES_PASSWORD: validation-only
          MAS_MATRIX_SECRET: validation-only-mas-matrix-secret-32b
          BOT_MATRIX_PASSWORD: validation-only
          BOT_CRYPTO_STORE_PASSPHRASE: validation-only
          LIVEKIT_KEY: validation-key
          LIVEKIT_SECRET: validation-only
          TURN_SHARED_SECRET: validation-only
          DEPLOY_PUBLIC_IP: 203.0.113.10
          GITHUB_REPOSITORY_OWNER: validation
          BOT_IMAGE_TAG: validation
          REDIS_PASSWORD: validation-only
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python scripts/validate-infrastructure.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Test and build React web + FormSpace MiniApp
        env:
          VITE_PUSH_GATEWAY_URL: ${{ secrets.VITE_PUSH_GATEWAY_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          ENABLE_PUSH: ${{ secrets.ENABLE_PUSH }}
          MATRIX_DOMAIN: ${{ secrets.MATRIX_DOMAIN }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          DOMAIN="${DOMAIN:-testhighlife.strangled.net}"
          MATRIX_DOMAIN="${MATRIX_DOMAIN:-$DOMAIN}"
          export VITE_ELEMENT_CALL_URL="https://call.${MATRIX_DOMAIN}"
          export VITE_LIVEKIT_JWT_URL="https://rtc.${MATRIX_DOMAIN}/livekit/jwt"
          export VITE_DEFAULT_HOMESERVER="https://${MATRIX_DOMAIN}"
          export VITE_MINIAPP_ALLOWED_ORIGINS="https://${MATRIX_DOMAIN}"
          # Default push gateway when Sygnal is on (ENABLE_PUSH) or VAPID is set.
          if [ -z "${VITE_PUSH_GATEWAY_URL:-}" ]; then
            if [ "${ENABLE_PUSH:-}" = "true" ] || [ "${ENABLE_PUSH:-}" = "1" ] || \
               [ -n "${VITE_VAPID_PUBLIC_KEY:-}" ]; then
              export VITE_PUSH_GATEWAY_URL="https://push.${MATRIX_DOMAIN}/_matrix/push/v1/notify"
            fi
          fi
          if { [ "${ENABLE_PUSH:-}" = "true" ] || [ "${ENABLE_PUSH:-}" = "1" ]; } && \
             [ -z "${VITE_VAPID_PUBLIC_KEY:-}" ]; then
            echo "::warning::ENABLE_PUSH=true but VITE_VAPID_PUBLIC_KEY is empty — web push stays off until the secret is set"
          fi
          npm ci
          npm test --workspace @highlife/web -- --run
          npm test --workspace @highlife/miniapp -- --run
          npm run typecheck --workspace @highlife/web
          npm run build --workspace @highlife/web
          npm run build --workspace @highlife/miniapp

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Build vodozemac WASM for Flutter web
        working-directory: apps/client
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y
            # shellcheck disable=SC1091
            source "$HOME/.cargo/env"
          fi
          bash scripts/build_vodozemac_wasm.sh

      - name: Build Flutter web
        id: flutter_web
        working-directory: apps/client
        env:
          MATRIX_DOMAIN: ${{ secrets.MATRIX_DOMAIN }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          DOMAIN="${DOMAIN:-testhighlife.strangled.net}"
          MATRIX_DOMAIN="${MATRIX_DOMAIN:-$DOMAIN}"
          flutter create . --project-name highlife_client --org app.highlife --platforms=web
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build web --release --base-href /flutter/ \
            --dart-define=HIGHLIFE_DEFAULT_HOMESERVER="https://${MATRIX_DOMAIN}" \
            --dart-define=HIGHLIFE_LIVEKIT_JWT_URL="https://rtc.${MATRIX_DOMAIN}/livekit/jwt" \
            --dart-define=HIGHLIFE_ELEMENT_CALL_URL="https://call.${MATRIX_DOMAIN}" \
            --dart-define=HIGHLIFE_LATEST_JSON_URL="https://${MATRIX_DOMAIN}/client/latest.json" \
            --dart-define=HIGHLIFE_RTC_AVAILABLE=true

      - name: Pack deployment bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_PUBLIC_IP: ${{ secrets.DEPLOY_PUBLIC_IP }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SYNAPSE_REGISTRATION_SECRET: ${{ secrets.SYNAPSE_REGISTRATION_SECRET }}
          MAS_POSTGRES_PASSWORD: ${{ secrets.MAS_POSTGRES_PASSWORD }}
          MAS_MATRIX_SECRET: ${{ secrets.MAS_MATRIX_SECRET }}
          BOT_MATRIX_PASSWORD: ${{ secrets.BOT_MATRIX_PASSWORD }}
          BOT_CRYPTO_STORE_PASSPHRASE: ${{ secrets.BOT_CRYPTO_STORE_PASSPHRASE }}
          DEMO_MATRIX_PASSWORD: ${{ secrets.DEMO_MATRIX_PASSWORD }}
          LIVEKIT_KEY: ${{ secrets.LIVEKIT_KEY }}
          LIVEKIT_SECRET: ${{ secrets.LIVEKIT_SECRET }}
          TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
          MATRIX_MINIAPP_SECRET: ${{ secrets.MATRIX_MINIAPP_SECRET }}
          FORMSPACE_ANONYMITY_SALT: ${{ secrets.FORMSPACE_ANONYMITY_SALT }}
          MATRIX_MINIAPP_CORS_ORIGIN: ${{ vars.MATRIX_MINIAPP_CORS_ORIGIN }}
          DOMAIN: ${{ secrets.DOMAIN }}
          MATRIX_DOMAIN: ${{ secrets.MATRIX_DOMAIN }}
          ENABLE_PUSH: ${{ secrets.ENABLE_PUSH }}
          SYGNAL_VAPID_PRIVATE_KEY: ${{ secrets.SYGNAL_VAPID_PRIVATE_KEY }}
          SYNAPSE_ENABLE_REGISTRATION: ${{ secrets.SYNAPSE_ENABLE_REGISTRATION }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          # Public Matrix domain: Caddyfile and Element Call config are rendered
          # from templates. Compose interpolates MATRIX_DOMAIN at runtime.
          DOMAIN="${DOMAIN:-testhighlife.strangled.net}"
          MATRIX_DOMAIN="${MATRIX_DOMAIN:-$DOMAIN}"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          bot_tag="$(git log -1 --format=%H -- bot)"
          test -n "$bot_tag"
          mkdir -p out/www/react out/www/flutter out/www/miniapp out/www/client
          cp -R apps/web/dist/. out/www/react/
          cp -R apps/miniapp/dist/. out/www/miniapp/
          if [ -f apps/client/build/web/flutter_bootstrap.js ] || [ -f apps/client/build/web/main.dart.js ]; then
            cp -R apps/client/build/web/. out/www/flutter/
          else
            echo "Flutter web build unavailable; shipping React-only static tree"
            printf '%s\n' \
              '<!doctype html><meta charset="utf-8"><title>HighLife Flutter</title>' \
              '<p>Flutter web build is unavailable on this deploy. Use the React client at /.</p>' \
              > out/www/flutter/index.html
          fi
          # latest.json only in the SCP/tar path — never ship the ~70MB APK over
          # password SCP (that alone stalled deploys for 40+ minutes). The host
          # pulls the APK from GitHub Releases only when the build number changes.
          export MATRIX_DOMAIN
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          out = Path("out/www/client")
          out.mkdir(parents=True, exist_ok=True)
          latest_path = out / "latest.json"
          token = os.environ.get("GITHUB_TOKEN") or ""
          repo = os.environ["GITHUB_REPOSITORY"]
          domain = os.environ.get("MATRIX_DOMAIN") or "testhighlife.strangled.net"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "highlife-deploy",
          }

          def fetch(url: str, accept: str) -> bytes:
              req = urllib.request.Request(url, headers={**headers, "Accept": accept})
              with urllib.request.urlopen(req) as resp:
                  return resp.read()

          try:
              release = json.loads(
                  fetch(
                      f"https://api.github.com/repos/{repo}/releases/latest",
                      "application/vnd.github+json",
                  ).decode()
              )
              assets = {a["name"]: a for a in release.get("assets", [])}
              meta = assets.get("latest.json")
              if not meta:
                  raise RuntimeError("latest.json missing from release")
              data = json.loads(fetch(meta["url"], "application/octet-stream").decode())
              apk_meta = (
                  assets.get("highlife-android.apk")
                  or assets.get("highlife.apk")
                  or assets.get("app-release.apk")
              )
              data.setdefault("assets", {})["android"] = (
                  f"https://{domain}/client/highlife.apk"
              )
              if apk_meta:
                  data["_apk_api_url"] = apk_meta["url"]
                  data["_apk_name"] = apk_meta["name"]
              latest_path.write_text(json.dumps(data, indent=2) + "\n")
              print(
                  "packed updater metadata",
                  data.get("version"),
                  data.get("build"),
                  "(APK fetched on host if needed)",
              )
          except Exception as err:
              print("updater mirror fallback:", err)
              latest_path.write_text(
                  json.dumps(
                      {"version": "0.0.0", "build": 0, "notes": "no release yet", "assets": {}},
                      indent=2,
                  )
                  + "\n"
              )
          PY
          grep -R -F "https://call.${MATRIX_DOMAIN}" out/www/react >/dev/null
          cp server/docker-compose.prod.yml out/
          export MATRIX_DOMAIN
          python3 - <<'PY'
          import os
          from pathlib import Path

          domain = os.environ["MATRIX_DOMAIN"]
          Path("out/Caddyfile").write_text(
              Path("server/Caddyfile.template").read_text().replace("__MATRIX_DOMAIN__", domain)
          )
          Path("out/element-call-config.json").write_text(
              Path("server/element-call-config.json.template")
              .read_text()
              .replace("__MATRIX_DOMAIN__", domain)
          )
          PY
          grep -F "default-src 'self'" out/Caddyfile >/dev/null
          grep -F "push.${MATRIX_DOMAIN}" out/Caddyfile >/dev/null
          cp server/sygnal.yaml out/
          # VAPID private key for Sygnal (webpush). Required when ENABLE_PUSH=true.
          if [ -n "${SYGNAL_VAPID_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$SYGNAL_VAPID_PRIVATE_KEY" > out/sygnal-vapid.pem
            # Secrets sometimes store literal \n — normalize to real newlines.
            python3 -c 'from pathlib import Path; p=Path("out/sygnal-vapid.pem"); t=p.read_text(); p.write_text(t.replace("\\n","\n") if (("BEGIN" not in t) or t.count(chr(10)) < 3) and ("\\n" in t) else t)'
            chmod 600 out/sygnal-vapid.pem
          elif [ "${ENABLE_PUSH:-}" = "true" ] || [ "${ENABLE_PUSH:-}" = "1" ]; then
            echo "::error::ENABLE_PUSH=true requires GitHub secret SYGNAL_VAPID_PRIVATE_KEY (PEM)"
            exit 1
          else
            # Bind mount must exist even when the push profile is idle.
            printf '%s\n' '-----BEGIN PRIVATE KEY-----' 'DISABLED' '-----END PRIVATE KEY-----' > out/sygnal-vapid.pem
            chmod 600 out/sygnal-vapid.pem
          fi
          cp server/bootstrap-bot.sh out/
          cp server/migrate-syn2mas.sh out/
          cp server/generate-synapse-config.sh out/
          cp server/generate-mas-config.sh out/
          cp server/init-mas-db.sh out/
          cp server/render-synapse-config.py out/
          cp server/render-mas-config.py out/
          chmod +x out/bootstrap-bot.sh out/migrate-syn2mas.sh \
            out/generate-synapse-config.sh out/generate-mas-config.sh out/init-mas-db.sh
          # Shell scripts must be LF for the remote Linux host.
          sed -i 's/\r$//' out/bootstrap-bot.sh out/migrate-syn2mas.sh \
            out/generate-synapse-config.sh out/generate-mas-config.sh out/init-mas-db.sh

          {
            printf 'DEPLOY_PUBLIC_IP=%s\n' "$DEPLOY_PUBLIC_IP"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'SYNAPSE_REGISTRATION_SECRET=%s\n' "$SYNAPSE_REGISTRATION_SECRET"
            printf 'MAS_POSTGRES_PASSWORD=%s\n' "$MAS_POSTGRES_PASSWORD"
            printf 'MAS_MATRIX_SECRET=%s\n' "$MAS_MATRIX_SECRET"
            printf 'BOT_MATRIX_PASSWORD=%s\n' "$BOT_MATRIX_PASSWORD"
            printf 'BOT_CRYPTO_STORE_PASSPHRASE=%s\n' "$BOT_CRYPTO_STORE_PASSPHRASE"
            printf 'DEMO_MATRIX_PASSWORD=%s\n' "$DEMO_MATRIX_PASSWORD"
            printf 'LIVEKIT_KEY=%s\n' "$LIVEKIT_KEY"
            printf 'LIVEKIT_SECRET=%s\n' "$LIVEKIT_SECRET"
            printf 'TURN_SHARED_SECRET=%s\n' "$TURN_SHARED_SECRET"
            printf 'GITHUB_REPOSITORY_OWNER=%s\n' "$owner"
            printf 'BOT_LOCALPART=highlifebot\n'
            printf 'DEMO_LOCALPART=demo\n'
            printf 'BOT_IMAGE_TAG=%s\n' "$bot_tag"
            printf 'GITHUB_REPOSITORY=%s\n' "${{ github.repository }}"
            printf 'DOMAIN=%s\n' "$DOMAIN"
            printf 'MATRIX_DOMAIN=%s\n' "$MATRIX_DOMAIN"
            # Closed by default; set true for a public demo.
            printf 'SYNAPSE_ENABLE_REGISTRATION=%s\n' "${SYNAPSE_ENABLE_REGISTRATION:-false}"
            printf 'ENABLE_PUSH=%s\n' "${ENABLE_PUSH:-false}"
            printf 'MATRIX_MINIAPP_CORS_ORIGIN=%s\n' \
              "${MATRIX_MINIAPP_CORS_ORIGIN:-https://${MATRIX_DOMAIN}}"
            if [ -n "${REDIS_PASSWORD:-}" ]; then
              printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            fi
            if [ -n "${MATRIX_MINIAPP_SECRET:-}" ]; then
              printf 'MATRIX_MINIAPP_SECRET=%s\n' "$MATRIX_MINIAPP_SECRET"
            fi
            if [ -n "${FORMSPACE_ANONYMITY_SALT:-}" ]; then
              printf 'FORMSPACE_ANONYMITY_SALT=%s\n' "$FORMSPACE_ANONYMITY_SALT"
            fi
          } > out/deploy.env
          chmod 600 out/deploy.env

          # One compressed stream beats thousands of SCP file round-trips (Flutter web).
          tar -C out -czf out/deploy-bundle.tgz \
            www \
            docker-compose.prod.yml \
            Caddyfile \
            sygnal.yaml \
            sygnal-vapid.pem \
            bootstrap-bot.sh \
            migrate-syn2mas.sh \
            generate-synapse-config.sh \
            generate-mas-config.sh \
            init-mas-db.sh \
            render-synapse-config.py \
            render-mas-config.py \
            element-call-config.json \
            deploy.env
          ls -lh out/deploy-bundle.tgz

      - name: Upload deployment bundle
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Pass both; appleboy uses key when present, otherwise password.
          # Never modifies sshd — interactive password login on the VPS is untouched.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: "out/deploy-bundle.tgz"
          target: /opt/highlife
          strip_components: 1
          overwrite: true
          rm: false

      - name: Start fresh Synapse stack
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            sudo mkdir -p /opt/highlife
            sudo chown -R "$(id -u):$(id -g)" /opt/highlife
            cd /opt/highlife
            test -f deploy-bundle.tgz
            # Keep the mirrored APK across www replace when the build is unchanged.
            rm -f /tmp/highlife-apk.prev /tmp/highlife-apk.prev-build
            if [ -f www/client/highlife.apk ] && [ -f www/client/latest.json ]; then
              cp -f www/client/highlife.apk /tmp/highlife-apk.prev
              python3 -c 'import json; print(json.load(open("www/client/latest.json")).get("build",""))' \
                >/tmp/highlife-apk.prev-build 2>/dev/null || true
            fi
            tar -xzf deploy-bundle.tgz
            rm -f deploy-bundle.tgz
            mv deploy.env .env
            chmod 600 .env
            python3 - <<'PY'
            import os, secrets
            from pathlib import Path

            env_path = Path(".env")
            lines = env_path.read_text().splitlines()
            values = {}
            for line in lines:
                if not line or line.startswith("#") or "=" not in line:
                    continue
                key, _, value = line.partition("=")
                values[key] = value

            def ensure(name: str, filename: str) -> str:
                file = Path(filename)
                value = os.environ.get(name) or values.get(name) or ""
                if not value and file.is_file():
                    value = file.read_text().strip()
                if not value:
                    value = secrets.token_hex(32)
                file.write_text(value + "\n")
                file.chmod(0o600)
                return value

            updates = {
                "REDIS_PASSWORD": ensure("REDIS_PASSWORD", "redis.pass"),
                "MATRIX_MINIAPP_SECRET": ensure("MATRIX_MINIAPP_SECRET", "miniapp.secret"),
            }
            salt = os.environ.get("FORMSPACE_ANONYMITY_SALT") or values.get(
                "FORMSPACE_ANONYMITY_SALT", ""
            )
            if salt:
                updates["FORMSPACE_ANONYMITY_SALT"] = salt

            kept = []
            seen = set()
            for line in lines:
                if not line or line.startswith("#") or "=" not in line:
                    kept.append(line)
                    continue
                key, _, _ = line.partition("=")
                if key in updates:
                    kept.append(f"{key}={updates[key]}")
                    seen.add(key)
                else:
                    kept.append(line)
            for key, value in updates.items():
                if key not in seen:
                    kept.append(f"{key}={value}")
            env_path.write_text("\n".join(kept) + "\n")
            env_path.chmod(0o600)
            print("host secrets persisted")
            PY
            set -a
            . ./.env
            set +a

            # Host pulls APK from GitHub only when missing or build number changed.
            python3 - <<'PY'
            import json, os, shutil, urllib.request
            from pathlib import Path

            client = Path("www/client")
            client.mkdir(parents=True, exist_ok=True)
            latest_path = client / "latest.json"
            apk_path = client / "highlife.apk"
            if not latest_path.is_file():
                raise SystemExit(0)

            data = json.loads(latest_path.read_text())
            build = str(data.get("build", ""))
            api_url = data.pop("_apk_api_url", None)
            data.pop("_apk_name", None)
            domain = os.environ.get("MATRIX_DOMAIN") or os.environ.get("DOMAIN") or \
                "testhighlife.strangled.net"
            data.setdefault("assets", {})["android"] = (
                f"https://{domain}/client/highlife.apk"
            )
            latest_path.write_text(json.dumps(data, indent=2) + "\n")

            prev = Path("/tmp/highlife-apk.prev")
            prev_build = ""
            prev_build_path = Path("/tmp/highlife-apk.prev-build")
            if prev_build_path.is_file():
                prev_build = prev_build_path.read_text().strip()

            def restore_prev() -> bool:
                # /tmp and /opt may be different filesystems — copy, don't rename.
                if not (prev.is_file() and prev.stat().st_size > 1_000_000):
                    return False
                shutil.copy2(prev, apk_path)
                return True

            if prev_build == build and restore_prev():
                print("APK unchanged (build %s); kept previous mirror" % build)
                raise SystemExit(0)

            token = os.environ.get("GHCR_TOKEN") or ""
            if not api_url or not token:
                if restore_prev():
                    print("APK asset URL/token missing; restored previous mirror")
                else:
                    print("APK not mirrored (missing asset URL or token)")
                raise SystemExit(0)

            print("fetching APK from GitHub Releases (build %s)" % build)
            req = urllib.request.Request(
                api_url,
                headers={
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/octet-stream",
                    "User-Agent": "highlife-deploy",
                },
            )
            with urllib.request.urlopen(req) as resp:
                apk_path.write_bytes(resp.read())
            print("APK mirrored", apk_path.stat().st_size, "bytes")
            PY

            if [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            # One-time Conduit/Relay cutover: free host ports and remove legacy
            # compose projects. Their volumes are retained and never attached
            # to Synapse.
            for project in relay conduit matrix; do
              legacy="$(docker ps -aq --filter "label=com.docker.compose.project=${project}")"
              if [ -n "$legacy" ]; then
                docker rm -f $legacy || true
              fi
            done
            # Stop any non-HighLife container still bound to ACME/HTTPS ports.
            for port in 80 443; do
              holders="$(docker ps --format '{{.ID}} {{.Names}}' | while read -r id name; do
                if docker port "$id" 2>/dev/null | grep -E ":${port}->|0.0.0.0:${port}" >/dev/null; then
                  case "$name" in
                    highlife-*) ;;
                    *) echo "$id" ;;
                  esac
                fi
              done)"
              if [ -n "$holders" ]; then
                echo "Freeing host port ${port} from: ${holders}"
                docker rm -f $holders || true
              fi
            done

            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml pull
            sed -i 's/\r$//' generate-synapse-config.sh generate-mas-config.sh \
              init-mas-db.sh bootstrap-bot.sh migrate-syn2mas.sh \
              render-synapse-config.py render-mas-config.py || true

            # Bring Postgres up first so MAS DB init / syn2mas can run.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans postgres
            for _ in $(seq 1 60); do
              if docker compose -f docker-compose.prod.yml exec -T postgres \
                pg_isready -U synapse -d synapse >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            if ! COMPOSE_FILE=docker-compose.prod.yml sh ./migrate-syn2mas.sh; then
              echo "::error::MAS config/migration failed"
              docker compose -f docker-compose.prod.yml logs --tail=200 \
                mas-config-generate mas-config mas-db-init || true
              exit 1
            fi

            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate caddy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # Optional Matrix push gateway (Sygnal). Set ENABLE_PUSH=true in deploy.env
            # and create DNS A record for push.<domain>. Does not affect SSH auth.
            if [ "${ENABLE_PUSH:-}" = "true" ] || [ "${ENABLE_PUSH:-}" = "1" ]; then
              echo "Starting Sygnal (compose profile push)"
              test -f sygnal-vapid.pem
              grep -q 'BEGIN' sygnal-vapid.pem
              docker compose -f docker-compose.prod.yml --profile push up -d --remove-orphans sygnal
              for _ in $(seq 1 30); do
                st="$(docker compose -f docker-compose.prod.yml --profile push ps --status running --services 2>/dev/null | grep -F sygnal || true)"
                if [ -n "$st" ]; then break; fi
                sleep 2
              done
            fi
            # Keep the bot down until smoke finishes. Logging in as highlifebot
            # and then immediately starting the bot burned the account rc_login
            # bucket and left the container in a 429 restart loop.
            docker compose -f docker-compose.prod.yml stop bot || true

            MATRIX_DOMAIN="${MATRIX_DOMAIN:-${DOMAIN:-testhighlife.strangled.net}}"
            PRIMARY="https://${MATRIX_DOMAIN}"
            AUTH_HOST="auth.${MATRIX_DOMAIN}"
            CALL_HOST="call.${MATRIX_DOMAIN}"
            RTC_HOST="rtc.${MATRIX_DOMAIN}"

            ready=0
            for _ in $(seq 1 90); do
              if curl --fail --silent --show-error \
                "${PRIMARY}/_matrix/client/versions" >/dev/null; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=160 \
                synapse mas caddy synapse-config mas-config lk-jwt-service livekit
              exit 1
            fi

            COMPOSE_FILE=docker-compose.prod.yml sh ./bootstrap-bot.sh

            docker compose -f docker-compose.prod.yml restart synapse mas
            for _ in $(seq 1 60); do
              if docker compose -f docker-compose.prod.yml exec -T synapse \
                curl --fail --silent http://127.0.0.1:8008/_matrix/client/versions >/dev/null; then
                break
              fi
              sleep 2
            done
            sleep 20

            curl_ok() {
              url="$1"
              shift
              attempt=1
              while [ "$attempt" -le 8 ]; do
                code="$(curl --silent --output /tmp/highlife-curl.out --write-out '%{http_code}' \
                  "$@" "$url" || true)"
                if [ "$code" = "200" ] || [ "$code" = "204" ]; then
                  return 0
                fi
                echo "probe ${url} -> HTTP ${code} (attempt ${attempt}/8)"
                if [ "$code" = "429" ] || [ "$code" = "000" ]; then
                  sleep $((attempt * 8))
                else
                  sleep 3
                fi
                attempt=$((attempt + 1))
              done
              echo "::error::Probe failed for ${url} (last HTTP ${code})"
              sed -n '1,40p' /tmp/highlife-curl.out || true
              return 1
            }

            login_account() {
              localpart="$1"
              password="$2"
              attempt=1
              while [ "$attempt" -le 6 ]; do
                # Compat login is served by MAS (proxied on the public HS URL).
                payload="$(LOGIN_USER="$localpart" LOGIN_PASS="$password" python3 -c \
                  'import json,os; print(json.dumps({"type":"m.login.password","identifier":{"type":"m.id.user","user":os.environ["LOGIN_USER"]},"password":os.environ["LOGIN_PASS"]}))')"
                if curl --fail --silent --show-error \
                  -H 'Content-Type: application/json' \
                  --data "$payload" \
                  "${PRIMARY}/_matrix/client/v3/login" |
                  grep -F '"access_token"' >/dev/null; then
                  echo "login ${localpart} ok"
                  return 0
                fi
                echo "login ${localpart} failed (attempt ${attempt}/6)"
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
              done
              echo "::error::Login probe failed for ${localpart}"
              return 1
            }
            # Probe demo only. Bot password is exercised by the running container
            # below; a second highlifebot login here races the bot's own login.
            login_account "$DEMO_LOCALPART" "$DEMO_MATRIX_PASSWORD"
            # Named volume may be root-owned from an earlier rootful run; the
            # image runs as uid 1000 (node) and must write .session.json / crypto.
            # Preserve the crypto store across deploys. If session/device id
            # diverges from OlmMachine, wipe via Recover bot (recover-bot.yml).
            docker compose -f docker-compose.prod.yml run --rm --no-deps --user 0 \
              --entrypoint sh bot -c '
                mkdir -p /app/data
                # Intentionally not wiping crypto/session on every deploy:
                # find /app/data -mindepth 1 -maxdepth 1 ! -name formspace.json ! -name crypto-passphrase.json -exec rm -rf {} +
                chown -R 1000:1000 /app/data
              '
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate bot
            bot_ready=0
            for _ in $(seq 1 45); do
              status="$(docker inspect highlife-bot-1 --format '{{.State.Status}}' 2>/dev/null || true)"
              if [ "$status" = "running" ] && \
                 docker compose -f docker-compose.prod.yml logs --no-color --tail=80 bot 2>/dev/null |
                   grep -E 'FormSpace as|HighLife showcase as' >/dev/null; then
                bot_ready=1
                break
              fi
              if [ "$status" = "restarting" ]; then
                echo "bot still restarting; recent logs:"
                docker compose -f docker-compose.prod.yml logs --no-color --tail=40 bot || true
              fi
              sleep 4
            done
            if [ "$bot_ready" != 1 ]; then
              echo "::error::Bot failed to stay up after deploy"
              docker compose -f docker-compose.prod.yml ps bot || true
              docker compose -f docker-compose.prod.yml logs --no-color --tail=120 bot || true
              exit 1
            fi
            echo "bot showcase online"

            # Legacy /register is not the Element X path; OIDC-native clients
            # register via MAS account UI. Probe compat login discovery instead.
            curl_ok "${PRIMARY}/_matrix/client/v3/login"
            grep -F 'm.login.password' /tmp/highlife-curl.out >/dev/null
            echo "MAS compat login discovery ok"

            curl_ok "${PRIMARY}/_matrix/federation/v1/version"
            curl_ok "${PRIMARY}/.well-known/matrix/server"
            grep -F "\"m.server\":\"${MATRIX_DOMAIN}:443\"" /tmp/highlife-curl.out >/dev/null
            curl_ok "${PRIMARY}/.well-known/matrix/client"
            grep -F 'org.matrix.msc4143.rtc_foci' /tmp/highlife-curl.out >/dev/null
            grep -F 'org.matrix.msc2965.authentication' /tmp/highlife-curl.out >/dev/null
            grep -F "https://${AUTH_HOST}/" /tmp/highlife-curl.out >/dev/null
            curl_ok "${PRIMARY}/"
            curl_ok "${PRIMARY}/flutter/flutter_bootstrap.js"

            main_headers="$(curl --fail --silent --show-error --head \
              "${PRIMARY}/" | tr -d '\r')"
            printf '%s\n' "$main_headers" |
              grep -Fi 'content-security-policy:' |
              grep -F 'default-src' >/dev/null
            printf '%s\n' "$main_headers" |
              grep -Fi 'permissions-policy:' |
              grep -F "https://${CALL_HOST}" >/dev/null

            PUSH_HOST="push.${MATRIX_DOMAIN}"
            dns_missing=0
            dns_hosts="${AUTH_HOST} ${CALL_HOST} ${RTC_HOST}"
            if [ "${ENABLE_PUSH:-}" = "true" ] || [ "${ENABLE_PUSH:-}" = "1" ]; then
              dns_hosts="${dns_hosts} ${PUSH_HOST}"
            fi
            for host in $dns_hosts; do
              if getent hosts "$host" >/dev/null 2>&1 || \
                 dig +short "$host" @1.1.1.1 >/dev/null 2>&1; then
                :
              else
                echo "::error::Missing DNS A record: ${host} -> ${DEPLOY_PUBLIC_IP} (see docs/SECRETS.md)"
                dns_missing=1
              fi
            done
            if [ "$dns_missing" = 1 ]; then
              docker compose -f docker-compose.prod.yml ps
              echo "Homeserver smoke passed; auth/MatrixRTC hostnames still need DNS"
              exit 1
            fi

            # Kick ACME for newly published hostnames (auth.) after DNS is confirmed.
            docker compose -f docker-compose.prod.yml restart caddy
            auth_ready=0
            for _ in $(seq 1 36); do
              code="$(curl --silent --output /tmp/highlife-auth-oidc.out --write-out '%{http_code}' \
                --max-time 15 "https://${AUTH_HOST}/.well-known/openid-configuration" || true)"
              if [ "$code" = "200" ] && \
                 grep -F "https://${AUTH_HOST}" /tmp/highlife-auth-oidc.out >/dev/null; then
                auth_ready=1
                break
              fi
              echo "auth ACME/OIDC probe -> HTTP ${code}; waiting"
              sleep 5
            done
            if [ "$auth_ready" != 1 ]; then
              echo "::error::auth hostname not serving OIDC discovery yet"
              docker compose -f docker-compose.prod.yml logs --no-color --tail=120 caddy || true
              docker compose -f docker-compose.prod.yml exec -T caddy \
                wget -q -O - http://mas:8080/.well-known/openid-configuration | head -c 400 || true
              exit 1
            fi
            cp /tmp/highlife-auth-oidc.out /tmp/highlife-curl.out
            # Synapse advertises MAS metadata for OIDC-native clients (Element X).
            auth_meta_ok=0
            for path in \
              "/_matrix/client/v1/auth_metadata" \
              "/_matrix/client/unstable/org.matrix.msc2965/auth_metadata"; do
              if curl --fail --silent --show-error "${PRIMARY}${path}" \
                >/tmp/highlife-auth-meta.out; then
                if grep -F "https://${AUTH_HOST}" /tmp/highlife-auth-meta.out >/dev/null; then
                  auth_meta_ok=1
                  break
                fi
              fi
            done
            if [ "$auth_meta_ok" != 1 ]; then
              echo "::error::Homeserver auth_metadata does not advertise ${AUTH_HOST}"
              sed -n '1,80p' /tmp/highlife-auth-meta.out || true
              exit 1
            fi
            curl_ok "https://${CALL_HOST}/"
            curl_ok "https://${RTC_HOST}/livekit/jwt/healthz"
            if [ "${ENABLE_PUSH:-}" = "true" ] || [ "${ENABLE_PUSH:-}" = "1" ]; then
              curl_ok "https://${PUSH_HOST}/health"
            fi

            call_headers="$(curl --fail --silent --show-error --head \
              "https://${CALL_HOST}/" | tr -d '\r')"
            printf '%s\n' "$call_headers" |
              grep -Fi "content-security-policy: frame-ancestors https://${MATRIX_DOMAIN}" >/dev/null
            if printf '%s\n' "$call_headers" | grep -qi '^x-frame-options:'; then
              echo "Element Call must not emit X-Frame-Options" >&2
              exit 1
            fi

            docker compose -f docker-compose.prod.yml ps
            echo "HighLife deployment and federation smoke checks passed"
