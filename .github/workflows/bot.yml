name: Bot

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/bot.yml"
  pull_request:
    paths:
      - "bot/**"
      - ".github/workflows/bot.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - working-directory: bot
        run: |
          npm ci
          npm test
          npm run typecheck

  image:
    needs: check
    # Publish from main pushes, or any branch via workflow_dispatch (needed so
    # Deploy HighLife on feature branches can pull BOT_IMAGE_TAG).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Image name (lowercase)
        id: img
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "bot_tag=$(git log -1 --format=%H -- bot)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: bot
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/highlife-bot:latest
            ghcr.io/${{ steps.img.outputs.owner }}/highlife-bot:${{ steps.img.outputs.bot_tag }}
