name: Bot

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "contracts/**"
      - ".github/workflows/bot.yml"
  pull_request:
    paths:
      - "bot/**"
      - "contracts/**"
      - ".github/workflows/bot.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - working-directory: bot
        run: |
          npm ci
          npm test
          npm run typecheck

  image:
    needs: check
    # Publish from main pushes, or any branch via workflow_dispatch (needed so
    # Deploy HighLife on feature branches can pull BOT_IMAGE_TAG).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image name (lowercase)
        id: img
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "bot_tag=$(git log -1 --format=%H -- bot)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: bot
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/highlife-formspace-bot:latest
            ghcr.io/${{ steps.img.outputs.owner }}/highlife-formspace-bot:${{ steps.img.outputs.bot_tag }}
